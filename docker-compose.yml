services:
  postgres:
    image: postgres:16-alpine
    container_name: aluguel-carros-postgres
    environment:
      POSTGRES_DB: aluguel
      POSTGRES_USER: aluguel
      POSTGRES_PASSWORD: aluguel
    ports:
      - "5432:5432"
    volumes:
      - aluguel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluguel -d aluguel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aluguel_postgres_data:
